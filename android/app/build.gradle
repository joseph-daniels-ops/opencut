plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'app.opencut.editor'
    compileSdk 34

    defaultConfig {
        applicationId "app.opencut.editor"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0.0-pro"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

tasks.register('syncWebAssets', Copy) {
    description = 'Sincroniza automaticamente a build Web do OpenCut para os assets Android nativos'
    from("${projectDir}/../../apps/web/public") {
        include '**/*'
    }
    into("${projectDir}/src/main/assets/public")
}

preBuild.dependsOn(syncWebAssets)

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.webkit:webkit:1.10.0'

    // Media3 Core & Transformer Engine (Google Android Media)
    implementation 'androidx.media3:media3-exoplayer:1.2.1'
    implementation 'androidx.media3:media3-transformer:1.2.1'
    implementation 'androidx.media3:media3-effect:1.2.1'
    implementation 'androidx.media3:media3-common:1.2.1'
}
